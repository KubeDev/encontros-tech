# Encontros Tech — manifestos Kubernetes da homologação (TRD, ADRs 002-010).
#
# Antes do primeiro deploy, crie o namespace e o Secret à mão (o Secret nunca entra no repositório):
#   kubectl create namespace encontros-tech
#   kubectl -n encontros-tech create secret generic encontros-tech-secrets \
#     --from-literal=DATABASE_URL="$(terraform -chdir=terraform output -raw database_url)"
#
# Aplicar:  kubectl apply -f k8s/encontros-tech.yaml
#
# Nova versão: publique a próxima tag vN no Docker Hub (tag publicada nunca é sobrescrita) e troque,
# neste arquivo, a tag da imagem, o SERVICE_VERSION e a label app.kubernetes.io/version; depois aplique.
---
apiVersion: v1
kind: Namespace
metadata:
  name: encontros-tech
  labels:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: encontros-tech-config
  namespace: encontros-tech
  labels:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/instance: encontros-tech-hml
    app.kubernetes.io/version: "v27"
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: kubectl
data:
  APP_TITLE: "Encontros Tech"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "simple"
  SERVICE_NAME: "encontros-tech"
  SERVICE_VERSION: "v27"
  # PROMETHEUS_MULTIPROC_DIR não deve ser definida (ADR 004)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encontros-tech
  namespace: encontros-tech
  labels:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/instance: encontros-tech-hml
    app.kubernetes.io/version: "v27"
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: encontros-tech
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: encontros-tech
        app.kubernetes.io/instance: encontros-tech-hml
        app.kubernetes.io/version: "v27"
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: encontros-tech
        app.kubernetes.io/managed-by: kubectl
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: encontros-tech
              app.kubernetes.io/component: web
      containers:
        - name: encontros-tech
          # Sem command/args: usa o ENTRYPOINT/CMD da imagem (gunicorn, 2 workers sync — ADR 005)
          image: fabricioveronez/encontros-tech:v27
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: encontros-tech-config
            - secretRef:
                name: encontros-tech-secrets
          # Sem probes, por decisão do TRD (Padrão dos manifestos Kubernetes)
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # /tmp gravável: métricas Prometheus (criadas no import) e heartbeat dos workers do gunicorn
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: encontros-tech
  namespace: encontros-tech
  labels:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/instance: encontros-tech-hml
    app.kubernetes.io/version: "v27"
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: kubectl
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
