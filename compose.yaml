services:
  app:
    build: .
    image: encontros-tech:${TAG:-local}
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?defina no .env}:${POSTGRES_PASSWORD:?defina no .env}@db:5432/${POSTGRES_DB:?defina no .env}
      APP_TITLE: ${APP_TITLE:-Encontros Tech}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-simple}
      SERVICE_NAME: ${SERVICE_NAME:-encontros-tech}
      SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
      # PROMETHEUS_MULTIPROC_DIR não deve ser definida (ADR 004)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
    volumes:
      # PostgreSQL 18+: o volume vai em /var/lib/postgresql (PGDATA fica em /var/lib/postgresql/18/docker)
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  db-data:
